<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Earthcall - The digital ontology engine interface. Connect and communicate with the core system.">
    <title>Earthcall | Ontology Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-container"></div>
    <div class="overlay"></div>

    <main class="container">
        <header>
            <div class="logo">
                <h1>Earthcall</h1>
                <span class="badge">Ontology Engine</span>
            </div>
            <div id="connection-status" class="status-indicator">
                <div class="dot"></div>
                <span id="status-text">Connecting...</span>
            </div>
        </header>

        <section class="interface-panel glass">
            <div class="panel-header">
                <h2>Logos Terminal</h2>
                <p>Speak your word into the world.</p>
            </div>
            
            <div class="log-container" id="log-container">
                <div class="log-entry system">System initialized. Awaiting connection...</div>
            </div>

            <form id="utterance-form" class="input-area">
                <input 
                    type="text" 
                    id="utterance-input" 
                    placeholder="Enter utterance (e.g. 'Joy', 'Sorrow')..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" id="emit-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span>Emit</span>
                </button>
            </form>
        </section>
        
        <footer>
            <p>&copy; Earthcall Project. All beings authored.</p>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
