name: Rung 8 visibility diagnostic

on:
  push:
    branches:
      - sol/rung8-visibility-ci-diagnostic-20260921

permissions:
  contents: read

jobs:
  webgpu-object-rung8:
    name: Rung 8 WebGPU object diagnostic (macOS)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Earthcall quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a" \
            >/tmp/rung8-configure.log 2>&1; then
            tail -120 /tmp/rung8-configure.log
            exit 1
          fi

      - name: Build only webgpu_object_test quietly
        shell: bash
        run: |
          set -euo pipefail
          if ! cmake --build build --parallel 4 --target webgpu_object_test \
            >/tmp/rung8-build.log 2>&1; then
            tail -160 /tmp/rung8-build.log
            exit 1
          fi

      - name: Run only WebGPU object/radiance witness
        shell: bash
        run: |
          set -o pipefail
          ./build/webgpu_object_test 2>&1 | tee /tmp/rung8-test.log
