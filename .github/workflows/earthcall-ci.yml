name: Earthcall focused CI

# CI is intentionally read-only. It builds and runs tests; it does not deploy,
# publish, merge, delete, upload releases, or write back to the repository.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthcall-focused-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-cpu-tests:
    name: Focused CPU tests (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report runner and vendored library architecture
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          cmake --version
          file local_deps/glfw_install/lib/libglfw3.a || true
          file local_deps/openssl-3.0.13/libcrypto.a || true
          file local_deps/openssl-3.0.13/libssl.a || true

      - name: Validate shell helpers
        shell: bash
        run: |
          set -euxo pipefail
          bash -n scripts/build.sh

      - name: Configure Earthcall
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"

      - name: Build focused regression witnesses
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 4 --target \
            earthcall_terminal \
            language_identity_reference_test \
            creation_tools_test \
            interaction_channel_test \
            keyboard_shell_shortcuts_test \
            creator_console_fixture_law_test \
            no_black_box_test \
            channel_paths_test \
            dynamic_property_reachability_test \
            relation_retry_lexeme_test \
            logos_modality_test \
            person_not_object_test \
            zone_native_save_isolation_test \
            perlin_zone_field_restore_test \
            object_roundtrip_test \
            object_serialization_test \
            matter_semantic_precedence_test \
            shape_hydration_integrity_test \
            synthesis_studio_zone_closure_test \
            chess_zone_native_boot_test \
            synthesis_studio_full_store_boot_test \
            second_nature_law_authoring_test \
            second_nature_law_forge_zone_test \
            prophetic_rete_test \
            home_identity_continuity_test \
            person_migration_test \
            person_home_migration_boot_test \
            person_database_test \
            body_part_test \
            person_serialization_test \
            person_display_name_identity_test \
            authorable_light_contract_test \
            timeline_test \
            law_file_tree_fossil_test \
            rete_state_ptr_index_test

      - name: Run Terminal exact-reference smoke
        shell: bash
        run: |
          set -euxo pipefail
          printf 'lex weight @lexeme.christ 0.42\nlex get @lexeme.christ\nform add @lexeme.christ\nexit\n' \
            | ./build/earthcall_terminal > terminal-smoke.log 2>&1
          grep -F 'lexeme.christ' terminal-smoke.log
          grep -F '0.42' terminal-smoke.log
          if grep -F "Lexeme '@lexeme.christ' not found" terminal-smoke.log; then
            cat terminal-smoke.log
            exit 1
          fi

      - name: Run focused regression witnesses
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build --output-on-failure \
            -R '^(language_identity_reference_test|creation_tools_test|interaction_channel_test|creator_console_fixture_law_test|keyboard_shell_shortcuts_test|no_black_box_test|channel_paths_test|dynamic_property_reachability_test|relation_retry_lexeme_test|logos_modality_test|person_not_object_test|zone_native_save_isolation_test|perlin_zone_field_restore_test|object_roundtrip_test|object_serialization_test|matter_semantic_precedence_test|shape_hydration_integrity_test|synthesis_studio_zone_closure_test|chess_zone_native_boot_test|synthesis_studio_full_store_boot_test|second_nature_law_authoring_test|second_nature_law_forge_zone_test|prophetic_rete_test|home_identity_continuity_test|person_migration_test|person_home_migration_boot_test|body_part_test|person_database_test|person_serialization_test|person_display_name_identity_test|authorable_light_contract_test|timeline_test|law_file_tree_fossil_test|rete_state_ptr_index_test)

  sdf-range-proxy-verification:
    name: SDF range-proxy verification (macOS)
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Earthcall
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"

      - name: Build SDF proof and GPU parity witnesses
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 4 --target \
            sdf_revision_split_test \
            sdf_wgsl_parameter_refresh_test \
            sdf_range_soundness_test \
            sdf_range_hierarchy_test \
            heightfield_predicate_test \
            channel_paths_test \
            webgpu_sdf_parity_test \
            webgpu_sdf_distance_test \
            webgpu_sdf_color_expr_test \
            webgpu_object_test

      - name: Run CPU SDF proof witnesses
        shell: bash
        run: |
          set -euxo pipefail
          ./build/sdf_revision_split_test
          ./build/sdf_wgsl_parameter_refresh_test
          ./build/sdf_range_soundness_test
          ./build/sdf_range_hierarchy_test
          ./build/heightfield_predicate_test
          ./build/channel_paths_test

      - name: Run native WebGPU SDF parity witnesses
        shell: bash
        run: |
          set -euxo pipefail
          ./build/webgpu_sdf_parity_test
          ./build/webgpu_sdf_distance_test
          ./build/webgpu_sdf_color_expr_test
          ./build/webgpu_object_test

  slow-adapter-independent-clock:
    name: Slow Adapter independent clock (macOS)
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Earthcall
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"

      - name: Build Slow Adapter witnesses
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --parallel 4 --target \
            slow_adapter_test \
            slow_adapter_parity_test \
            slow_adapter_clock_test \
            slow_adapter_zone_perf_test \
            law_direct_stress_test

      - name: Verify Slow Adapter soundness and independent cadence
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure \
            -R '^(slow_adapter_test|slow_adapter_parity_test|slow_adapter_clock_test)$'

      - name: Measure dramatic Law-Direct A/B
        shell: bash
        run: |
          set -euo pipefail
          ./build/law_direct_stress_test

      - name: Measure adapter impact across authored worlds
        shell: bash
        run: |
          set -euo pipefail
          worlds=(
            saves/worlds/chess_app.json
            saves/worlds/basic_pixel_changer.json
            saves/worlds/noise_floor.json
          )
          for world in "${worlds[@]}"; do
            echo "PERF_BEGIN world=$world"
            python3 - "$world" <<'PY'
          import subprocess
          import sys

          world = sys.argv[1]

          def run_mode(adapter, direct):
              cmd = ["./build/slow_adapter_zone_perf_test", world,
                     f"--adapter={adapter}", f"--direct={direct}", "--frames=60"]
              try:
                  result = subprocess.run(cmd, text=True, capture_output=True, timeout=120)
              except subprocess.TimeoutExpired:
                  print(f"ADAPTER_PERF_TIMEOUT world={world} adapter={adapter} direct={direct} timeout_s=120")
                  raise SystemExit(1)

              lines = [line for line in result.stdout.splitlines()
                       if line.startswith("ADAPTER_PERF ")]
              for line in lines:
                  print(line)
              if result.returncode != 0 or not lines:
                  tail = (result.stdout + "\n" + result.stderr).splitlines()[-20:]
                  print("\n".join(tail), file=sys.stderr)
                  raise SystemExit(result.returncode or 1)

              for token in lines[-1].split():
                  if token.startswith("frame_median_ms="):
                      return float(token.split("=")[1])
              return 0.0

          # Three arms, same commit/runner:
          #   floor      = no adapter, no Direct
          #   pre-direct = adapter ON, Direct OFF (the old terminal state)
          #   direct     = adapter ON, Direct ON
          off_ms = run_mode("off", "off")
          pre_direct_ms = run_mode("on", "off")
          direct_ms = run_mode("on", "on")

          if off_ms > 0:
              ratio = direct_ms / off_ms
              diff = direct_ms - off_ms
              if ratio > 1.20 and diff > 1.0:
                  direct_ms_retry = run_mode("on", "on")
                  if direct_ms_retry < direct_ms:
                      direct_ms = direct_ms_retry
                      ratio = direct_ms / off_ms
                      diff = direct_ms - off_ms
              print(f"PERF_COMPARE world={world} off_ms={off_ms:.6f} on_ms={direct_ms:.6f} ratio={ratio:.2f} diff={diff:.6f}")
              if ratio > 1.20 and diff > 1.0:
                  print(f"ERROR: Slow Adapter + Direct regression too high! Allowed ratio <= 1.20 or diff <= 1.0ms")
                  raise SystemExit(2)

          if pre_direct_ms > 0:
              direct_ratio = direct_ms / pre_direct_ms
              direct_diff = direct_ms - pre_direct_ms
              print(f"LAW_DIRECT_WORLD_COMPARE world={world} pre_direct_ms={pre_direct_ms:.6f} direct_ms={direct_ms:.6f} ratio={direct_ratio:.2f} diff={direct_diff:.6f}")
          PY
          done


