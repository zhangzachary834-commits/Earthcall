name: Earthcall focused CI

# CI is intentionally read-only. It builds and runs tests; it does not deploy,
# publish, merge, delete, upload releases, or write back to the repository.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earthcall-focused-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-cpu-tests:
    name: Living Studio apply-stage profile (macOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report runner architecture
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          uname -m
          cmake --version

      - name: Apply CI-only Law apply-stage profiler
        shell: bash
        run: |
          set -euxo pipefail
          python3 scratch/sol_profile_law_tick.py

      - name: Configure Earthcall
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"

      - name: Build Living Instrument probe
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 4 --target frame_lag_test

      - name: Profile Living Instrument apply stages
        id: living_profile
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json \
            2>&1 | tee living-apply-stage-profile.txt
          status=${PIPESTATUS[0]}
          echo "benchmark_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify stage profiler output
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh living-apply-stage-profile.txt
          grep -m 1 'SOL_APPLY_STAGE' living-apply-stage-profile.txt
          grep -m 1 'SOL_LAW_PERF' living-apply-stage-profile.txt

      - name: Upload Living Instrument stage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-instrument-apply-stage-${{ github.run_id }}
          path: living-apply-stage-profile.txt
          if-no-files-found: error
          overwrite: true

      - name: Preserve benchmark failure status
        if: always()
        shell: bash
        env:
          BENCHMARK_STATUS: ${{ steps.living_profile.outputs.benchmark_status }}
        run: |
          benchmark_status=${BENCHMARK_STATUS:-1}
          echo "Living Instrument benchmark: $benchmark_status"
          if [[ "$benchmark_status" != "0" ]]; then
            exit 1
          fi
