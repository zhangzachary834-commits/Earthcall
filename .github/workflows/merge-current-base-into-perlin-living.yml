name: Merge current base into Perlin Living restoration

on:
  push:
    branches:
      - sol-restore-perlin-living-studio-2026-09-14
    paths:
      - .github/workflows/merge-current-base-into-perlin-living.yml

permissions:
  contents: write

jobs:
  merge-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge protected base without mutating workflow content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPT-5.6 Sol conflict resolver"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin sync-from-earthcall-main

          set +e
          git merge --no-ff --no-commit origin/sync-from-earthcall-main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected=".github/workflows/earthcall-ci.yml"
          unexpected="$(comm -23 <(printf '%s\n' "$conflicts") <(printf '%s\n' "$expected"))"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected merge conflicts; refusing to guess:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          # The Actions token may not push a commit whose first-parent diff
          # changes a workflow. Keep this branch's already-green CI file for
          # the merge commit itself. After the base ancestry is integrated,
          # the authenticated GitHub connector will union the base's newest
          # witness into this file directly.
          if grep -Fxq '.github/workflows/earthcall-ci.yml' <<<"$conflicts"; then
            git checkout --ours -- .github/workflows/earthcall-ci.yml
            git add .github/workflows/earthcall-ci.yml
          fi

          remaining="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$remaining" ]]; then
            echo "Unresolved paths remain; refusing merge commit:"
            printf '%s\n' "$remaining"
            exit 1
          fi
          git diff --check

          if [[ $merge_status -eq 0 ]] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Base was already incorporated; nothing to merge."
            exit 0
          fi
          git commit -m "Merge current base into Perlin and Living restoration"
          git push origin HEAD:sol-restore-perlin-living-studio-2026-09-14
