name: Merge current base into Perlin Living restoration

on:
  push:
    branches:
      - sol-restore-perlin-living-studio-2026-09-14
    paths:
      - .github/workflows/merge-current-base-into-perlin-living.yml

permissions:
  contents: write

jobs:
  merge-base:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge protected base and resolve only known overlaps
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GPT-5.6 Sol conflict resolver"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin sync-from-earthcall-main

          set +e
          git merge --no-ff --no-commit origin/sync-from-earthcall-main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U | sort)"
          expected="$(printf '%s\n' '.github/workflows/earthcall-ci.yml' 'docs/Agenda/Tasks/For Zach/Person Verification List.md' | sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$conflicts") <(printf '%s\n' "$expected"))"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected merge conflicts; refusing to guess:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          # Keep every newer focused-CI witness from base, then restore the two
          # preservation witnesses this branch introduced.
          if grep -Fxq '.github/workflows/earthcall-ci.yml' <<<"$conflicts"; then
            git checkout --theirs -- .github/workflows/earthcall-ci.yml
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/earthcall-ci.yml')
          text = path.read_text()
          anchor = '            zone_native_save_isolation_test\n'
          additions = ('            perlin_zone_field_restore_test \\\n'
                       '            synthesis_studio_zone_closure_test\n')
          if 'perlin_zone_field_restore_test' not in text:
              if anchor not in text:
                  raise SystemExit('focused CI build anchor drifted; refusing blind edit')
              text = text.replace(anchor, '            zone_native_save_isolation_test \\\n' + additions, 1)
          regex_anchor = 'zone_native_save_isolation_test)$\''
          if 'synthesis_studio_zone_closure_test)' not in text:
              if regex_anchor not in text:
                  raise SystemExit('focused CI regex anchor drifted; refusing blind edit')
              text = text.replace(
                  regex_anchor,
                  'zone_native_save_isolation_test|perlin_zone_field_restore_test|synthesis_studio_zone_closure_test)$\'',
                  1)
          path.write_text(text)
          PY

          # Keep all newer Person-verification entries from base, then restore
          # the single restoration witness under the existing Studio section.
          person='docs/Agenda/Tasks/For Zach/Person Verification List.md'
          if grep -Fxq "$person" <<<"$conflicts"; then
            git checkout --theirs -- "$person"
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/Agenda/Tasks/For Zach/Person Verification List.md')
          text = path.read_text()
          marker = "## Synthesis Studio (added 2026-09-02, from the play-test that corrected the audit's first pass)\n"
          bullet = "\n- [ ] **Perlin hills + Living Studio Zone-native restoration — GPT-5.6 Sol, 2026-09-14:** fully quit any stale running Earthcall instance **without saving its old live Zones**, relaunch this restored build, then use Creator Console → Zones. Move to `NoiseFloorWorld` and verify the rolling Perlin SDF hills are visible again. Then Move to `SynthesisStudio.LivingInstrument` without loading a legacy World: play C5 and several other pads, verify each note is audible, and verify the corresponding floating resonator sphere visibly swells/rises and relaxes while the pad still depresses/releases. Automated Zone-native witnesses prove the SDF payload rehydrates and C5 reaches the audio sink at 523.25 Hz and grows its matching sphere; this checkbox is the remaining Person-facing visual/audio manifestation witness.\n"
          if bullet.strip() not in text:
              if marker not in text:
                  raise SystemExit('Synthesis Studio heading drifted; refusing blind append')
              text = text.replace(marker, marker + bullet, 1)
          path.write_text(text)
          PY

          git add .github/workflows/earthcall-ci.yml "$person"
          remaining="$(git diff --name-only --diff-filter=U)"
          if [[ -n "$remaining" ]]; then
            echo "Unresolved paths remain; refusing merge commit:"
            printf '%s\n' "$remaining"
            exit 1
          fi
          git diff --check

          if [[ $merge_status -eq 0 ]] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "Base was already incorporated; nothing to merge."
            exit 0
          fi
          git commit -m "Merge current base into Perlin and Living restoration"
          git push origin HEAD:sol-restore-perlin-living-studio-2026-09-14
