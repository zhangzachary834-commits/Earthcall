name: Restore Perlin and Living Studio

on:
  push:
    branches:
      - sol-restore-perlin-living-studio-2026-09-14
    paths:
      - .github/workflows/restore-perlin-living.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Perform preservation-scoped restoration
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          backup_root = root / 'saves/backups/perlin-living-restoration-2026-09-14'
          backup_root.mkdir(parents=True, exist_ok=True)

          # ------------------------------------------------------------
          # 1. Perlin Noise Floor: recover only the authored Field payload.
          # ------------------------------------------------------------
          perlin_target_path = root / 'saves/zones/NoiseFloorWorld/zone.json'
          perlin_source_path = root / 'saves/worlds/noise_floor.json'
          shutil.copy2(perlin_target_path, backup_root / 'NoiseFloorWorld.zone.before.json')

          target = json.loads(perlin_target_path.read_text())
          source_doc = json.loads(perlin_source_path.read_text())
          source_zone = next(z for z in source_doc['zones']
                             if z.get('identifier') == 'NoiseFloorWorld')

          def object_by_id(zone, ident):
              return next(o for o in zone['world']['objects'] if o.get('objectID') == ident)

          src_obj = object_by_id(source_zone, 'perlin-ground-plane')
          dst_obj = object_by_id(target, 'perlin-ground-plane')
          assert src_obj.get('shapeKind') == 10 and dst_obj.get('shapeKind') == 10
          assert 'field' in src_obj and 'fieldExtent' in src_obj
          # Preserve every later Zone/Object edit; restore only the lost SDF payload.
          dst_obj['field'] = src_obj['field']
          dst_obj['fieldExtent'] = src_obj['fieldExtent']
          if 'fieldCellSize' in src_obj:
              dst_obj['fieldCellSize'] = src_obj['fieldCellSize']
          else:
              dst_obj.pop('fieldCellSize', None)
          perlin_target_path.write_text(json.dumps(target, indent=2) + '\n')

          # ------------------------------------------------------------
          # 2. Living Studio: migrate authored Laws to shared roots and
          #    attach the complete closure by stable lawRefs.
          # ------------------------------------------------------------
          living_target_path = root / 'saves/zones/SynthesisStudio.LivingInstrument/zone.json'
          living_source_path = root / 'saves/worlds/synthesis_studio_living.json'
          shutil.copy2(living_target_path, backup_root / 'SynthesisStudio.LivingInstrument.zone.before.json')

          living = json.loads(living_target_path.read_text())
          legacy = json.loads(living_source_path.read_text())
          legacy_zone = next(z for z in legacy['zones']
                             if z.get('identifier') == 'SynthesisStudio.LivingInstrument')
          assert living.get('identifier') == 'SynthesisStudio.LivingInstrument'

          bundle = legacy['authoredLaws']
          laws = bundle.get('laws', [])
          triggers = bundle.get('triggers', {})
          assert laws, 'legacy Living Studio has no authored Laws to migrate'

          object_ids = {o.get('objectID') for o in living['world']['objects']}
          law_ids = []
          for law in laws:
              law_id = law.get('id')
              assert isinstance(law_id, str) and law_id and not law_id.startswith('law-') is False
              assert law_id not in law_ids, f'duplicate law id {law_id}'
              authors = law.get('authors', [])
              assert authors, f'{law_id} has no authors'
              # The historical Studio deliberately uses Object beings to represent
              # First-Mover model authors. They must stay themselves; do not forge
              # Zach as author merely to satisfy the shared-root loader.
              unresolved = [a for a in authors if a != 'Zach' and a not in object_ids]
              assert not unresolved, f'{law_id} authors absent from target Zone: {unresolved}'
              law_ids.append(law_id)

              root_doc = {
                  'authors': authors,
                  'identifier': law_id,
                  'injected_by': 'GPT-5.6 Sol, preservation migration authorized by Zach, 2026-09-14',
                  'law': law,
                  'triggers': triggers.get(law_id, []),
              }
              law_path = root / 'saves/laws' / law_id / 'law.json'
              law_path.parent.mkdir(parents=True, exist_ok=True)
              if law_path.exists():
                  existing = json.loads(law_path.read_text())
                  # Never clobber a different shared root.
                  assert existing.get('identifier') == law_id
                  assert existing.get('law') == law
                  assert existing.get('triggers', []) == root_doc['triggers']
              else:
                  law_path.write_text(json.dumps(root_doc, indent=2) + '\n')

          living['lawRefs'] = law_ids
          living_target_path.write_text(json.dumps(living, indent=2) + '\n')

          # ------------------------------------------------------------
          # 3. Shared Law roots may be authored by any Singular author being.
          #    Person-only resolution was stricter than Law::addAuthor(Singular&)
          #    and contradicts the declared First-Mover author Objects in this save.
          # ------------------------------------------------------------
          zm_path = root / 'src/ZonesOfEarth/ZoneManager.cpp'
          zm = zm_path.read_text()
          old = '''                    Singular* author = resolveReference(authorJson.get<std::string>(), true);\n                    if (!author) {\n                        throw std::runtime_error("Law '" + ref + "' cannot resolve Person author '" +\n                                                 authorJson.get<std::string>() + "'");\n                    }\n                    law->addAuthor(*author);'''
          new = '''                    // Authorship is a Formation of Singular beings, not a Person-only slot.\n                    // First-Mover author Objects (for example the declared model author\n                    // beings in Synthesis Studio) remain Objects; never forge a Person\n                    // identity merely to make a shared Law root load.\n                    Singular* author = resolveReference(authorJson.get<std::string>(), false);\n                    if (!author) {\n                        throw std::runtime_error("Law '" + ref + "' cannot resolve author '" +\n                                                 authorJson.get<std::string>() + "'");\n                    }\n                    law->addAuthor(*author);'''
          assert zm.count(old) == 1, 'shared-Law author-resolution seam drifted'
          zm_path.write_text(zm.replace(old, new))

          # Mechanical integrity checks over the restored artifacts.
          reread_perlin = json.loads(perlin_target_path.read_text())
          restored = object_by_id(reread_perlin, 'perlin-ground-plane')
          assert restored['field'] == src_obj['field']
          assert restored['fieldExtent'] == src_obj['fieldExtent']

          reread_living = json.loads(living_target_path.read_text())
          assert reread_living['lawRefs'] == law_ids
          for law_id in law_ids:
              root_doc = json.loads((root / 'saves/laws' / law_id / 'law.json').read_text())
              assert root_doc['identifier'] == law_id
              assert root_doc['law']['id'] == law_id

          handoff = root / 'agent intercom/communication-threads/Perlin_Living_Studio_Restoration_2026-09-14.md'
          handoff.write_text(f'''# Perlin + Living Studio restoration — 2026-09-14\n\nAuthor: GPT-5.6 Sol, at Zach's explicit request to restore the disappeared Perlin hills and the Living Studio's silent/frozen note responses.\n\n## Restored\n\n- `saves/zones/NoiseFloorWorld/zone.json`: restored only `perlin-ground-plane.field` and `fieldExtent` from the intact authored `saves/worlds/noise_floor.json`. Every other current Zone/Object field is preserved.\n- `saves/zones/SynthesisStudio.LivingInstrument/zone.json`: added `{len(law_ids)}` stable `lawRefs`, preserving the current Zone body and object membership.\n- `saves/laws/<id>/law.json`: materialized the `{len(law_ids)}` authored Living Studio Laws as shared roots with their original law text, original author identifiers, and trigger bindings from `saves/worlds/synthesis_studio_living.json`.\n- `ZoneManager::switchTo`: shared Law root authors now resolve as `Singular`, matching `Law::addAuthor(Singular&)`. This preserves declared First-Mover author Objects rather than falsely rewriting them as Persons.\n\n## Preservation / provenance\n\nExact pre-restoration Zone bytes are retained under `saves/backups/perlin-living-restoration-2026-09-14/`. The Perlin repair is field-scoped. The Studio migration does not regenerate or replace any Object. Zach authorized this restoration after reporting that buttons still visibly react while sound and corresponding resonator-sphere growth no longer occur.\n\n## Remaining verification\n\nAutomated live-path coverage should enter `SynthesisStudio.LivingInstrument` through `ZoneManager::switchTo()` (without legacy `loadState`), click a note, assert the audio sink receives its authored frequency, and assert the corresponding resonance sphere grows. A Person-facing desktop witness remains required for audible/visual acceptance.\n''')

          print(f'Restored Perlin field and migrated {len(law_ids)} Living Studio Law roots.')
          PY

      - name: Validate JSON and migration shape
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('.')
          perlin = json.loads((p/'saves/zones/NoiseFloorWorld/zone.json').read_text())
          obj = next(o for o in perlin['world']['objects'] if o['objectID']=='perlin-ground-plane')
          assert 'field' in obj and 'fieldExtent' in obj
          living = json.loads((p/'saves/zones/SynthesisStudio.LivingInstrument/zone.json').read_text())
          refs = living.get('lawRefs', [])
          assert len(refs) >= 60
          assert len(refs) == len(set(refs))
          for r in refs:
              root = json.loads((p/'saves/laws'/r/'law.json').read_text())
              assert root['identifier'] == r == root['law']['id']
          print('validated', len(refs), 'Living Studio shared Law roots')
          PY

      - name: Commit restoration to branch
        run: |
          git config user.name "GPT-5.6 Sol restoration"
          git config user.email "actions@users.noreply.github.com"
          git add saves/zones/NoiseFloorWorld/zone.json \
                  saves/zones/SynthesisStudio.LivingInstrument/zone.json \
                  saves/laws \
                  saves/backups/perlin-living-restoration-2026-09-14 \
                  src/ZonesOfEarth/ZoneManager.cpp \
                  "agent intercom/communication-threads/Perlin_Living_Studio_Restoration_2026-09-14.md"
          git commit -m "Restore Perlin SDF and Living Studio Law closure"
          git push origin HEAD:sol-restore-perlin-living-studio-2026-09-14
