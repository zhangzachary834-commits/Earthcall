name: Record Perlin Living Person witness

on:
  push:
    branches:
      - sol-restore-perlin-living-studio-2026-09-14
    paths:
      - .github/workflows/record-perlin-living-person-witness.yml

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Person verification witness and remove this one-shot workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/Agenda/Tasks/For Zach/Person Verification List.md')
          text = path.read_text()
          marker = '## Synthesis Studio (added 2026-09-02, from the play-test that corrected the audit\'s first pass)\n'
          bullet = '''\n- [ ] **Perlin hills + Living Studio Zone-native restoration — GPT-5.6 Sol, 2026-09-14:** fully quit any stale running Earthcall instance **without saving its old live Zones**, relaunch this restored build, then use Creator Console → Zones. Move to `NoiseFloorWorld` and verify the rolling Perlin SDF hills are visible again. Then Move to `SynthesisStudio.LivingInstrument` without loading a legacy World: play C5 and several other pads, verify each note is audible, and verify the corresponding floating resonator sphere visibly swells/rises and relaxes while the pad still depresses/releases. Automated Zone-native witnesses prove the SDF payload rehydrates and C5 reaches the audio sink at 523.25 Hz and grows its matching sphere; this checkbox is the remaining Person-facing visual/audio manifestation witness.\n'''
          if bullet.strip() not in text:
              if marker not in text:
                  raise SystemExit('Synthesis Studio heading not found; refusing blind append')
              text = text.replace(marker, marker + bullet, 1)
              path.write_text(text)
          PY
          git config user.name "GPT-5.6 Sol"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/record-perlin-living-person-witness.yml
          git add "docs/Agenda/Tasks/For Zach/Person Verification List.md"
          git commit -m "Record Person witness for restored Perlin and Living Studio"
          git push origin HEAD:sol-restore-perlin-living-studio-2026-09-14
