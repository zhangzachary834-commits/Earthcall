name: Living Studio tick-record collection probe

on:
  push:
    branches:
      - sol/event-interest-fastpath-latest-20260914
    paths:
      - .github/workflows/living-studio-tick-record-probe.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure baseline
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target frame_lag_test -j3

      - name: A - current collecting tick return records
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee tick-record-A.txt
          echo "A_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Install production no-record fast path and witness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              p.write_text(s.replace(old, new))

          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.hpp',
              '    std::vector<Law::ApplicationRecord> tick();',
              '    std::vector<Law::ApplicationRecord> tick(bool collectRecords = true);')
          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.hpp',
              '    void runDriveSessions(std::vector<Law::ApplicationRecord>& records);',
              '    void runDriveSessions(std::vector<Law::ApplicationRecord>* records);')
          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.hpp',
              '    void applyAndMaybeDrive(Law& law, Singular& subject,\n                            std::vector<Law::ApplicationRecord>& records);',
              '    void applyAndMaybeDrive(Law& law, Singular& subject,\n                            std::vector<Law::ApplicationRecord>* records);')

          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              'std::vector<Law::ApplicationRecord> LawManager::tick() {',
              'std::vector<Law::ApplicationRecord> LawManager::tick(bool collectRecords) {')
          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              '    std::vector<Law::ApplicationRecord> records;\n    for (int round = 0;',
              '    std::vector<Law::ApplicationRecord> records;\n    auto* recordSink = collectRecords ? &records : nullptr;\n    for (int round = 0;')
          replace_all(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              'applyAndMaybeDrive(*law, *being, records);',
              'applyAndMaybeDrive(*law, *being, recordSink);',
              1)
          replace_all(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              'applyAndMaybeDrive(*law, *subject, records);',
              'applyAndMaybeDrive(*law, *subject, recordSink);',
              3)
          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              '    runDriveSessions(records);',
              '    runDriveSessions(recordSink);')
          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              'void LawManager::applyAndMaybeDrive(Law& law, Singular& subject,\n                                    std::vector<Law::ApplicationRecord>& records) {\n    const Law::ApplicationResult result = law.applyTo(subject);\n    if (law.applicationLog().empty()) return;\n    const Law::ApplicationRecord& record = law.applicationLog().back();\n    records.push_back(record);',
              'void LawManager::applyAndMaybeDrive(Law& law, Singular& subject,\n                                    std::vector<Law::ApplicationRecord>* records) {\n    const Law::ApplicationResult result = law.applyTo(subject);\n    if (law.applicationLog().empty()) return;\n    if (records) {\n        const Law::ApplicationRecord& record = law.applicationLog().back();\n        records->push_back(record);\n    }')
          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              'void LawManager::runDriveSessions(std::vector<Law::ApplicationRecord>& records) {',
              'void LawManager::runDriveSessions(std::vector<Law::ApplicationRecord>* records) {')
          replace_once(
              'src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
              '            if (!law->applicationLog().empty()) {\n                records.push_back(law->applicationLog().back());\n            }',
              '            if (records && !law->applicationLog().empty()) {\n                records->push_back(law->applicationLog().back());\n            }')

          replace_once(
              'tests/singularity/frame_lag_test.cpp',
              '    r.firings = lawManager.tick().size();',
              '    if (std::getenv("EARTHCALL_LAG_NO_TICK_RECORDS")) {\n        lawManager.tick(false);\n        r.firings = 0;\n    } else {\n        r.firings = lawManager.tick().size();\n    }')
          PY

          cat > tests/law/tick_record_observation_test.cpp <<'CPP'
          #include "ZonesOfEarth/AuthorsOfLaw/Law.hpp"
          #include "ConstructedBeing/Singular/Object/Object.hpp"
          #include <cassert>
          #include <cstdio>

          int main() {
              Object author("tick-record-author");
              Object target("tick-record-target");
              LawManager manager;

              auto law = manager.createLaw("tick-record-observation", {&author});
              law->setActivation(Law::Activation::WhileTrue);
              law->addTarget(target);

              int executions = 0;
              law->addAction("count execution", [&executions](const ECA::Event&, Singular&) {
                  ++executions;
              });

              const auto hidden = manager.tick(false);
              assert(hidden.empty());
              assert(executions == 1);
              assert(!law->applicationLog().empty());

              const auto visible = manager.tick();
              assert(!visible.empty());
              assert(executions == 2);
              assert(!law->applicationLog().empty());

              std::puts("tick_record_observation_test: ALL OK");
          }
          CPP

      - name: Reconfigure and build patched probe
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target tick_record_observation_test frame_lag_test -j3

      - name: Hard semantic witness
        run: ./build/tick_record_observation_test | tee tick-record-semantic.txt

      - name: B - production mode without returned tick records
        run: |
          set +e
          EARTHCALL_LAG_NO_TICK_RECORDS=1 ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee tick-record-B.txt
          echo "B_EXIT=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0

      - name: Print A/B headline
        run: |
          echo '=== A collect records ==='
          grep -E 'Tick [0-9]+:|LAG +median simulation frame|of that, LawManager::tick|95th-percentile frame|LawManager::tick grows|machine steadiness' tick-record-A.txt || true
          echo '=== B no returned records ==='
          grep -E 'Tick [0-9]+:|LAG +median simulation frame|of that, LawManager::tick|95th-percentile frame|LawManager::tick grows|machine steadiness' tick-record-B.txt || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: living-tick-record-probe-${{ github.run_id }}
          path: |
            tick-record-A.txt
            tick-record-B.txt
            tick-record-semantic.txt
