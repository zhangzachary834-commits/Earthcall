name: Patch Living Studio closure-local reference resolution

on:
  push:
    branches:
      - sol/fix-living-studio-real-boot-refusal-20260915
    paths:
      - .github/workflows/patch-living-studio-reference-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make Zone closure references local-first
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/ZonesOfEarth/ZoneManager.cpp')
          text = path.read_text()
          start = text.index('        const auto resolveReference = [&](const std::string& id,')
          end = text.index('\n\n        try {', start)
          replacement = r'''        const auto resolveReference = [&](const std::string& id,
                                          bool preferPerson) -> Singular* {
            if (id.empty()) return nullptr;

            const auto appendUnique = [](std::vector<Singular*>& candidates, Singular* being) {
                if (being && std::find(candidates.begin(), candidates.end(), being) == candidates.end()) {
                    candidates.push_back(being);
                }
            };
            const auto identifierMatches = [&](Singular* being) {
                if (!being) return false;
                if (auto* person = dynamic_cast<Person*>(being)) {
                    return person->matchesIdentifier(id);
                }
                return being->getIdentifier() == id;
            };

            // Authorship may name a real Person or a model-author Object. When a
            // human Person answers the identifier, prefer that actual Person so a
            // legacy Object with the same slug can never impersonate them (Refusal
            // #5). If no Person answers, model-author Objects remain valid.
            if (preferPerson) {
                std::vector<Singular*> people;
                for (Singular* being : Universe::instance().beings()) {
                    if (dynamic_cast<Person*>(being) && identifierMatches(being)) {
                        appendUnique(people, being);
                    }
                }
                if (people.size() == 1) return people.front();
                if (people.size() > 1) return nullptr;
            }

            // A shared Law root named by targetZone->lawRefs belongs to the
            // closure being preflighted. Resolve an unqualified Object/Zone ref
            // against that closure FIRST. Forked Zones intentionally preserve
            // author-marker identities (SynthesisStudio and its Living fork both
            // carry studio.author.codex); a sibling copy must not make the
            // target's own referent ambiguous. The previous all-Zones scan did
            // exactly that, so the isolated closure test passed while a real boot
            // with every Zone hydrated refused the move.
            std::vector<Singular*> local;
            if (identifierMatches(targetZone.get())) appendUnique(local, targetZone.get());
            for (const auto& object : targetZone->getOwnedObjects()) {
                if (identifierMatches(object.get())) appendUnique(local, object.get());
            }
            if (local.size() == 1) return local.front();
            if (local.size() > 1) return nullptr;

            // Shared/global beings (Materials, Categories, Laws, active-world
            // beings, Zone roots, etc.) remain the next lexical scope. Exclude
            // Persons here when authorship already tried them above; for ordinary
            // target resolution they remain candidates like every Singular.
            std::vector<Singular*> shared;
            for (Singular* being : Universe::instance().beings()) {
                if (preferPerson && dynamic_cast<Person*>(being)) continue;
                if (identifierMatches(being)) appendUnique(shared, being);
            }
            if (shared.size() == 1) return shared.front();
            if (shared.size() > 1) return nullptr;

            // Compatibility fallback for older cross-Zone references: only when
            // neither the target closure nor the shared Universe answers do we
            // consult sibling Zone-owned Objects, preserving the old reach while
            // refusing a genuinely ambiguous cross-Zone identifier.
            std::vector<Singular*> siblings;
            for (const auto& zone : _zones) {
                if (!zone || zone.get() == targetZone.get()) continue;
                if (identifierMatches(zone.get())) appendUnique(siblings, zone.get());
                for (const auto& object : zone->getOwnedObjects()) {
                    if (identifierMatches(object.get())) appendUnique(siblings, object.get());
                }
            }
            return siblings.size() == 1 ? siblings.front() : nullptr;
        };'''
          text = text[:start] + replacement + text[end:]
          # Authorship prefers an actual Person when one answers the id, then
          # falls back to the Zone-local model-author Object. Targets are purely
          # lexical and therefore do not receive Person preference.
          old_author = 'Singular* author = resolveReference(authorJson.get<std::string>(), false);'
          new_author = 'Singular* author = resolveReference(authorJson.get<std::string>(), true);'
          if old_author not in text:
              raise SystemExit('expected author-resolution call not found')
          text = text.replace(old_author, new_author, 1)
          path.write_text(text)
          PY

          git diff --check
          git diff -- src/ZonesOfEarth/ZoneManager.cpp
          git config user.name "GPT-5.6 Sol"
          git config user.email "actions@users.noreply.github.com"
          git add src/ZonesOfEarth/ZoneManager.cpp
          git commit -m "Resolve Zone Law references within target closure first"
          git push origin HEAD:sol/fix-living-studio-real-boot-refusal-20260915
