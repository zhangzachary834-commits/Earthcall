name: Verify persistent state refresh

# Read-only verifier. Candidate source is patched only inside the Actions checkout.
on:
  push:
    branches:
      - sol/post-formation-rete-living-profile-20260915
    paths:
      - .github/workflows/persistent-state-refresh-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure and build baseline
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target rete_state_refresh_test event_interest_filter_test frame_lag_test -j3

      - name: Prove baseline witness is red
        run: |
          set +e
          ./build/rete_state_refresh_test > witness-before.txt 2>&1
          status=$?
          set -e
          cat witness-before.txt
          test "$status" -ne 0

      - name: Baseline Living Instrument
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee baseline.txt
          exit 0

      - name: Apply local candidate
        run: |
          set -euxo pipefail
          python3 scratch/patch_persistent_state_refresh.py
          git diff --check
          git diff -- src/ZonesOfEarth/AuthorsOfLaw/Law.cpp src/ZonesOfEarth/AuthorsOfLaw/Law.hpp | tee candidate.patch

      - name: Build candidate and related witnesses
        run: |
          set -euxo pipefail
          cmake --build build --target \
            rete_state_refresh_test \
            event_interest_filter_test \
            prophetic_rete_test \
            rete_compile_test \
            rete_relation_state_test \
            edge_reactive_path_test \
            reactive_departure_test \
            vocabulary_index_test \
            frame_lag_test \
            -j3

      - name: Run headless semantic witnesses
        run: |
          set -euxo pipefail
          ./build/rete_state_refresh_test | tee witness-after.txt
          ./build/event_interest_filter_test | tee event-interest.txt

      - name: Candidate Living Instrument
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee candidate.txt
          exit 0

      - name: Print A/B headlines
        run: |
          echo '=== BASELINE ==='
          grep -E 'Tick [0-9]+:|simulation frame|by phase|of that, LawManager::tick|machine calibration|machine steadiness' baseline.txt || true
          echo '=== CANDIDATE ==='
          grep -E 'Tick [0-9]+:|simulation frame|by phase|of that, LawManager::tick|machine calibration|machine steadiness' candidate.txt || true

      - name: Upload verified source and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persistent-state-refresh-verified-${{ github.run_id }}
          path: |
            src/ZonesOfEarth/AuthorsOfLaw/Law.cpp
            src/ZonesOfEarth/AuthorsOfLaw/Law.hpp
            candidate.patch
            witness-before.txt
            witness-after.txt
            event-interest.txt
            baseline.txt
            candidate.txt
          if-no-files-found: ignore
