name: Law tick record-copy ablation

on:
  push:
    branches:
      - sol/law-tick-observability-ablation-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Living Instrument record-copy A/B
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CXXFLAGS: -fno-sanitize=address
      OBJCXXFLAGS: -fno-sanitize=address
      LDFLAGS: -fno-sanitize=address

    steps:
      - name: Check out stacked event-interest fix
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report exact source and runner
        shell: bash
        run: |
          set -euxo pipefail
          git rev-parse HEAD
          git log -2 --oneline
          uname -a
          cmake --version

      - name: Configure
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="$CXXFLAGS" \
            -DCMAKE_OBJCXX_FLAGS="$OBJCXXFLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --parallel 4 --target frame_lag_test

      - name: A — normal per-tick ApplicationRecord copies
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json \
            2>&1 | tee law-tick-record-A-normal.txt
          echo "A benchmark status: ${PIPESTATUS[0]}" | tee -a law-tick-record-A-normal.txt
          exit 0

      - name: Ablate only LawManager per-tick record copies
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp')
          s = p.read_text()

          direct = '    records.push_back(record);'
          direct_count = s.count(direct)
          assert direct_count == 1, f'expected one applyAndMaybeDrive record copy, found {direct_count}'
          s = s.replace(direct, '    (void)record;  // CI ablation: caller did not request per-tick observations', 1)

          nested = 'records.push_back(law->applicationLog().back());'
          nested_count = s.count(nested)
          assert nested_count >= 1, f'expected at least one drive/apply record copy, found {nested_count}'
          s = s.replace(nested, '(void)law->applicationLog().back();  // CI ablation: no per-tick copy')

          p.write_text(s)
          print(f'ablated 1 direct copy + {nested_count} applicationLog copies')
          PY
          git diff -- src/ZonesOfEarth/AuthorsOfLaw/Law.cpp
          cmake --build build --parallel 4 --target frame_lag_test

      - name: B — LawManager record copies disabled
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json \
            2>&1 | tee law-tick-record-B-no-copy.txt
          echo "B benchmark status: ${PIPESTATUS[0]}" | tee -a law-tick-record-B-no-copy.txt
          exit 0

      - name: Print A/B headline
        if: always()
        shell: bash
        run: |
          echo '=== A normal ==='
          grep -E 'machine calibration|LawManager::tick grows|simulation frame|of that, LawManager::tick|95th-percentile|machine steadiness|broken invariants|timing regressions' law-tick-record-A-normal.txt || true
          echo '=== B no per-tick record copies ==='
          grep -E 'machine calibration|LawManager::tick grows|simulation frame|of that, LawManager::tick|95th-percentile|machine steadiness|broken invariants|timing regressions' law-tick-record-B-no-copy.txt || true

      - name: Upload plain-text reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: law-tick-record-copy-${{ github.run_id }}
          path: |
            law-tick-record-A-normal.txt
            law-tick-record-B-no-copy.txt
          if-no-files-found: warn
          overwrite: true
