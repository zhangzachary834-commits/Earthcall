name: Portfolio bridge Python witnesses

on:
  pull_request:
    paths:
      - 'src/Singularity/Foreign/py/api/routes.py'
      - 'src/Singularity/Foreign/py/bridge.py'
      - 'tests/singularity/py/test_portfolio_bridge.py'
      - '.github/workflows/portfolio-bridge-python.yml'
  push:
    paths:
      - 'src/Singularity/Foreign/py/api/routes.py'
      - 'src/Singularity/Foreign/py/bridge.py'
      - 'tests/singularity/py/test_portfolio_bridge.py'
      - '.github/workflows/portfolio-bridge-python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-bridge-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute portfolio origin and snapshot regression tests
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv .venv-portfolio
          .venv-portfolio/bin/python -m pip install --disable-pip-version-check "Flask==3.0.0" "websockets==15.0.1"
          .venv-portfolio/bin/python -m unittest discover -s tests/singularity/py -p test_portfolio_bridge.py -v
