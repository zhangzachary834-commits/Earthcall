name: Promote proven event-interest fastpath

on:
  push:
    branches:
      - sol/event-interest-fastpath-event-moment-v2-20260914
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply proven production change and install permanent witness
        shell: bash
        run: |
          set -euxo pipefail
          python3 scratch/sol_event_interest_fastpath.py
          cp scratch/sol_event_interest_filter_probe.cpp tests/law/event_interest_filter_test.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/law/event_interest_filter_test.cpp')
          s = p.read_text()
          s = s.replace('// CI-only semantic witness for the Event-as-Moment event-interest fast path.',
                        '// Regression witness: authored state alphas are not arbitrary Event listeners.')
          s = s.replace('sol_event_interest_filter_probe: ALL OK',
                        'event_interest_filter_test: ALL OK')
          p.write_text(s)
          PY
          git rm scratch/sol_event_interest_fastpath.py
          git rm scratch/sol_event_interest_filter_probe.cpp
          git rm .github/workflows/living-studio-event-moment-fastpath.yml
          git rm .github/workflows/promote-event-interest-fastpath.yml
          git diff --check

      - name: Configure required build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"

      - name: Build and run permanent semantic gates
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 4 --target event_test event_interest_filter_test frame_lag_test
          ./build/event_test
          ./build/event_interest_filter_test

      - name: Record post-fix Living Instrument witness
        shell: bash
        run: |
          set +e
          set -o pipefail
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json \
            2>&1 | tee living-instrument-post-fastpath.txt
          echo "frame_lag_test status: ${PIPESTATUS[0]}" | tee -a living-instrument-post-fastpath.txt
          exit 0

      - name: Commit production fix
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'OpenAI Sol'
          git config user.email 'noreply@openai.com'
          git add src/ZonesOfEarth/AuthorsOfLaw/Law.cpp tests/law/event_interest_filter_test.cpp
          git add -u
          git status --short
          git commit -m 'Fix event-interest classification for authored Rete alphas'
          git push origin HEAD:sol/event-interest-fastpath-event-moment-v2-20260914

      - name: Upload post-fix benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-studio-post-fastpath-${{ github.run_id }}
          path: living-instrument-post-fastpath.txt
          if-no-files-found: warn
