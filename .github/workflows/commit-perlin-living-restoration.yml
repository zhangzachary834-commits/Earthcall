name: Commit validated Perlin Living restoration

on:
  push:
    branches:
      - sol-restore-perlin-living-studio-2026-09-14
    paths:
      - .github/workflows/commit-perlin-living-restoration.yml

permissions:
  contents: write

jobs:
  commit-restoration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-run the already validated preservation transform
        run: |
          python3 - <<'PY'
          import pathlib, textwrap
          workflow = pathlib.Path('.github/workflows/restore-perlin-living-v2.yml').read_text()
          start_marker = "          import copy\n"
          end_marker = "          print('Perlin restored; Living law roots:', len(law_ids), 'migrated authors:', migrated_authors)\n"
          start = workflow.index(start_marker)
          end = workflow.index(end_marker, start) + len(end_marker)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<restoration-transform>', 'exec'), {})
          PY

      - name: Revalidate exact closure
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('.')
          perlin=json.loads((p/'saves/zones/NoiseFloorWorld/zone.json').read_text())
          field=next(o for o in perlin['world']['objects'] if o['objectID']=='perlin-ground-plane')
          assert 'field' in field and field['fieldExtent']==[1000.0,30.0,1000.0]
          living=json.loads((p/'saves/zones/SynthesisStudio.LivingInstrument/zone.json').read_text())
          refs=living['lawRefs']
          assert len(refs)==68 and len(refs)==len(set(refs))
          ids={o.get('objectID') for o in living['world']['objects']}
          assert 'author.gemini-spark' in ids and 'studio.author.astra' in ids
          for ref in refs:
              r=json.loads((p/'saves/laws'/ref/'law.json').read_text())
              assert r['identifier']==ref==r['law']['id']
          print('ready to commit:',len(refs),'Law roots + Perlin field')
          PY

      - name: Commit restoration and forced before-byte backups
        run: |
          git config user.name "GPT-5.6 Sol restoration"
          git config user.email "actions@users.noreply.github.com"
          git add saves/zones/NoiseFloorWorld/zone.json \
                  saves/zones/SynthesisStudio.LivingInstrument/zone.json \
                  saves/laws \
                  src/ZonesOfEarth/ZoneManager.cpp \
                  "agent intercom/communication-threads/Perlin_Living_Studio_Restoration_2026-09-14.md"
          git add -f saves/backups/perlin-living-restoration-2026-09-14
          git commit -m "Restore Perlin SDF and Living Studio Law closure"
          git push origin HEAD:sol-restore-perlin-living-studio-2026-09-14
