name: One-shot Chess and Basic Button closure audit
on:
  push:
    branches:
      - sol/restore-legacy-chess-button-zones-20260915
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect legacy sessions, Zone identities, and shared Law roots
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, collections
          root = pathlib.Path('.')

          cases = [
              ('Chess', pathlib.Path('saves/zones/Chess/zone.json'), pathlib.Path('saves/worlds/chess_app.json')),
              ('Basic2DButtonZone', pathlib.Path('saves/zones/Basic2DButtonZone/zone.json'), pathlib.Path('saves/worlds/basic_2d_button_zone.json')),
              ('Basic 2D Button Zone', pathlib.Path('saves/zones/Basic 2D Button Zone/zone.json'), pathlib.Path('saves/worlds/basic_2d_button_zone.json')),
          ]

          def load(path):
              with path.open() as f: return json.load(f)

          def laws_from_world(w):
              vals = []
              for key in ('laws','authoredLaws'):
                  v = w.get(key, [])
                  if isinstance(v, list): vals.extend(v)
              # some worlds keep laws under a nested current zone/session object; report keys below if absent
              return vals

          for label, zp, wp in cases:
              print(f'=== {label} ===')
              z = load(zp)
              w = load(wp)
              print('zone path:', zp)
              print('zone identifier:', z.get('identifier'))
              print('zone name:', z.get('name'))
              print('zone owner:', z.get('owner'))
              print('zone top keys:', sorted(z.keys()))
              print('zone object count:', len(z.get('world',{}).get('objects',[])))
              print('zone relations:', len(z.get('formationRelations',[])))
              print('zone lawRefs:', len(z.get('lawRefs',[])), z.get('lawRefs',[])[:8])
              print('zone authoredLaws:', len(z.get('authoredLaws',[])))
              print('world currentZoneId:', w.get('currentZoneId'))
              print('world zoneRefs:', w.get('zoneRefs'))
              print('world top keys:', sorted(w.keys()))
              laws = laws_from_world(w)
              print('world top-level law-ish count:', len(laws))
              if laws:
                  ids=[]; authors=collections.Counter(); targets=collections.Counter()
                  for entry in laws:
                      law = entry.get('law', entry) if isinstance(entry,dict) else {}
                      ident = entry.get('identifier') or law.get('identifier') or law.get('id')
                      ids.append(ident)
                      for a in law.get('authors', entry.get('authors',[]) if isinstance(entry,dict) else []): authors[str(a)] += 1
                      for t in law.get('targets', entry.get('targets',[]) if isinstance(entry,dict) else []): targets[str(t)] += 1
                  print('world law ids sample:', ids[:12])
                  print('world law authors:', dict(authors))
                  print('world law targets sample:', list(targets.items())[:12])
                  missing=[]
                  for ident in ids:
                      if not ident: continue
                      if not pathlib.Path('saves/laws', ident, 'law.json').exists(): missing.append(ident)
                  print('missing shared roots:', len(missing), missing[:20])
              print()

          # Find all Zone identities that semantically mention Chess/Button for duplicate analysis.
          print('=== duplicate identity scan ===')
          for p in sorted(pathlib.Path('saves/zones').glob('*/zone.json')):
              try: z=load(p)
              except Exception: continue
              ident=str(z.get('identifier','')); name=str(z.get('name',''))
              if 'Chess' in ident or 'Chess' in name or 'Button' in ident or 'Button' in name:
                  print(p, '=>', ident, '|', name, '| objects', len(z.get('world',{}).get('objects',[])), '| lawRefs', len(z.get('lawRefs',[])))

          # Shared-law root counts by prefixes already in saves/laws.
          print('=== existing shared law roots ===')
          for prefix in ('law-chess','law-basic','law-button'):
              vals=sorted(p.parent.name for p in pathlib.Path('saves/laws').glob(prefix+'*/law.json'))
              print(prefix, len(vals), vals[:30])
          PY
