name: One-shot Chess and Basic Button closure audit
on:
  push:
    branches:
      - sol/restore-legacy-chess-button-zones-20260915
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify exact legacy closure
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, collections, re
          def load(p):
              with open(p) as f: return json.load(f)

          w=load('saves/worlds/chess_app.json')
          z=load('saves/zones/Chess/zone.json')
          nz=next(x for x in w['zones'] if x.get('identifier')=='Chess')
          laws=w['authoredLaws']['laws']; lawids={x['id'] for x in laws}
          zoneids={x.get('objectID') for x in z['world']['objects']} | {'Chess'}
          cats={x.get('objectID'):x for x in w.get('categories',[]) if x.get('objectID')}
          support=set(cats)
          endpoints=set()
          types=collections.Counter()
          buckets=collections.Counter()
          samples=collections.defaultdict(list)
          for r in nz.get('formationRelations',[]):
              a,b=r.get('entityA'),r.get('entityB'); endpoints|={a,b}; types[r.get('type')]+=1
              def kind(x):
                  if x in zoneids: return 'zone'
                  if x in support: return 'support'
                  if x in lawids: return 'law'
                  if x in {'Zach','Player'}: return 'person'
                  return 'missing'
              k=tuple(sorted((kind(a),kind(b))))
              buckets[k]+=1
              if len(samples[k])<8: samples[k].append((r.get('type'),a,b))
          print('Chess current zone objects:', sorted(zoneids))
          print('Support unique ids:', sorted(support))
          print('Law ids:', len(lawids))
          print('Relation types:', dict(types))
          print('Relation endpoint buckets:')
          for k,v in sorted(buckets.items()): print(' ',k,v,'samples=',samples[k])
          missing=sorted(x for x in endpoints if x not in zoneids|support|lawids|{'Zach','Player'})
          print('Truly missing relation endpoints:',missing)

          # Identify ids referenced inside Law JSON string payloads, conservatively.
          serialized=json.dumps(laws)
          candidates=sorted(x for x in zoneids|support if x and x in serialized)
          print('Zone/support ids mentioned somewhere in Law JSON:', candidates)
          print('Model/support author ids:', sorted({a for l in laws for a in l.get('authors',[])}))

          bw=load('saves/worlds/basic_2d_button_zone.json')
          bz=load('saves/zones/Basic2DButtonZone/zone.json')
          blaws=bw['authoredLaws']['laws']
          print('Basic laws:', [x['id'] for x in blaws])
          print('Basic authors:', sorted({a for l in blaws for a in l.get('authors',[])}))
          print('Basic legacy support ids:', [x.get('objectID') for x in bw.get('categories',[])])
          old=next(x for x in bw['zones'] if x['identifier']=='Basic2DButtonZone')['world']['objects'][0]
          cur=bz['world']['objects'][0]
          print('Basic missing properties:', sorted(set(old.get('authoredProperties',{}))-set(cur.get('authoredProperties',{}))))
          PY
