name: Restore Perlin and Living Studio v2

on:
  push:
    branches:
      - sol-restore-perlin-living-studio-2026-09-14
    paths:
      - .github/workflows/restore-perlin-living-v2.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore authored data without regeneration
        run: |
          python3 - <<'PY'
          import copy
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          backup_root = root / 'saves/backups/perlin-living-restoration-2026-09-14'
          backup_root.mkdir(parents=True, exist_ok=True)

          def object_by_id(zone, ident):
              return next(o for o in zone['world']['objects'] if o.get('objectID') == ident)

          # Perlin: restore only the SDF authored payload from the intact legacy source.
          perlin_path = root / 'saves/zones/NoiseFloorWorld/zone.json'
          perlin_source_path = root / 'saves/worlds/noise_floor.json'
          shutil.copy2(perlin_path, backup_root / 'NoiseFloorWorld.zone.before.json')
          perlin = json.loads(perlin_path.read_text())
          perlin_source_doc = json.loads(perlin_source_path.read_text())
          perlin_source = next(z for z in perlin_source_doc['zones'] if z.get('identifier') == 'NoiseFloorWorld')
          src_field = object_by_id(perlin_source, 'perlin-ground-plane')
          dst_field = object_by_id(perlin, 'perlin-ground-plane')
          assert src_field.get('shapeKind') == dst_field.get('shapeKind') == 10
          assert 'field' in src_field and 'fieldExtent' in src_field
          dst_field['field'] = copy.deepcopy(src_field['field'])
          dst_field['fieldExtent'] = copy.deepcopy(src_field['fieldExtent'])
          if 'fieldCellSize' in src_field:
              dst_field['fieldCellSize'] = src_field['fieldCellSize']
          else:
              dst_field.pop('fieldCellSize', None)
          perlin_path.write_text(json.dumps(perlin, indent=2) + '\n')

          # Living Studio: migrate legacy law bundle to stable shared Law roots.
          living_path = root / 'saves/zones/SynthesisStudio.LivingInstrument/zone.json'
          living_source_path = root / 'saves/worlds/synthesis_studio_living.json'
          shutil.copy2(living_path, backup_root / 'SynthesisStudio.LivingInstrument.zone.before.json')
          living = json.loads(living_path.read_text())
          legacy = json.loads(living_source_path.read_text())
          assert living.get('identifier') == 'SynthesisStudio.LivingInstrument'
          bundle = legacy['authoredLaws']
          laws = bundle.get('laws', [])
          triggers = bundle.get('triggers', {})
          assert laws

          # Old Studio saves used the top-level categories bag as a compatibility
          # side channel for a model-author Object. Zone-native Law loading cannot
          # depend on loading the conglomerate categories bag, so migrate only
          # missing model-author referents into the Zone as off-screen, extra-spatial
          # Objects. Never synthesize a Person and never rewrite an author id.
          legacy_referents = {
              o.get('objectID'): o for o in legacy.get('categories', [])
              if isinstance(o, dict) and isinstance(o.get('objectID'), str)
          }
          object_ids = {o.get('objectID') for o in living['world']['objects']}
          needed_authors = []
          for law in laws:
              for author in law.get('authors', []):
                  if author != 'Zach' and author not in object_ids and author not in needed_authors:
                      needed_authors.append(author)

          migrated_authors = []
          for author in needed_authors:
              assert author.startswith('author.'), f'unexpected unresolved non-Person author: {author}'
              assert author in legacy_referents, f'legacy author referent not found: {author}'
              marker = copy.deepcopy(legacy_referents[author])
              # It was never supposed to be visible/pickable; the categories bag
              # made it extra-spatial. Preserve that semantics after moving it into
              # the Zone object closure by placing the Shape2D marker off-screen.
              marker['x2D'] = -10000.0
              marker['y2D'] = -10000.0
              marker['zOrder2D'] = -1000
              marker.setdefault('authoredProperties', {})['modelAuthorReferent'] = {'t':'bool','v':True}
              marker['authoredProperties']['migratedFrom'] = {'t':'string','v':'legacy.categories'}
              living['world']['objects'].append(marker)
              object_ids.add(author)
              migrated_authors.append(author)

          law_ids = []
          for law in laws:
              law_id = law.get('id')
              assert isinstance(law_id, str) and law_id.startswith('law-')
              assert law_id not in law_ids, f'duplicate Law id {law_id}'
              authors = law.get('authors', [])
              assert authors, f'{law_id} has no authors'
              unresolved = [a for a in authors if a != 'Zach' and a not in object_ids]
              assert not unresolved, f'{law_id} unresolved authors: {unresolved}'
              law_ids.append(law_id)
              root_doc = {
                  'authors': authors,
                  'identifier': law_id,
                  'injected_by': 'GPT-5.6 Sol preservation migration authorized by Zach, 2026-09-14',
                  'law': law,
                  'triggers': triggers.get(law_id, []),
              }
              law_path = root / 'saves/laws' / law_id / 'law.json'
              law_path.parent.mkdir(parents=True, exist_ok=True)
              if law_path.exists():
                  existing = json.loads(law_path.read_text())
                  assert existing.get('identifier') == law_id
                  assert existing.get('law') == law
                  assert existing.get('triggers', []) == root_doc['triggers']
              else:
                  law_path.write_text(json.dumps(root_doc, indent=2) + '\n')

          living['lawRefs'] = law_ids
          living_path.write_text(json.dumps(living, indent=2) + '\n')

          # Shared Law author resolution must match Law::addAuthor(Singular&).
          # Requiring Person here made legitimate model-author Objects impossible
          # to load without forging provenance.
          zm_path = root / 'src/ZonesOfEarth/ZoneManager.cpp'
          zm = zm_path.read_text()
          old = '''                    Singular* author = resolveReference(authorJson.get<std::string>(), true);\n                    if (!author) {\n                        throw std::runtime_error("Law '" + ref + "' cannot resolve Person author '" +\n                                                 authorJson.get<std::string>() + "'");\n                    }\n                    law->addAuthor(*author);'''
          new = '''                    // Authorship is a Formation of Singular beings, not a Person-only slot.\n                    // Declared model-author Objects remain Objects; never forge a Person\n                    // identity merely to make a shared Law root load.\n                    Singular* author = resolveReference(authorJson.get<std::string>(), false);\n                    if (!author) {\n                        throw std::runtime_error("Law '" + ref + "' cannot resolve author '" +\n                                                 authorJson.get<std::string>() + "'");\n                    }\n                    law->addAuthor(*author);'''
          assert zm.count(old) == 1, 'ZoneManager shared-Law author seam drifted'
          zm_path.write_text(zm.replace(old, new))

          # Mechanical restoration integrity.
          perlin_check = json.loads(perlin_path.read_text())
          field_check = object_by_id(perlin_check, 'perlin-ground-plane')
          assert field_check['field'] == src_field['field']
          assert field_check['fieldExtent'] == src_field['fieldExtent']
          living_check = json.loads(living_path.read_text())
          assert living_check['lawRefs'] == law_ids
          live_ids = {o.get('objectID') for o in living_check['world']['objects']}
          assert all(a in live_ids for a in migrated_authors)
          for law_id in law_ids:
              doc = json.loads((root / 'saves/laws' / law_id / 'law.json').read_text())
              assert doc['identifier'] == law_id == doc['law']['id']

          handoff = root / 'agent intercom/communication-threads/Perlin_Living_Studio_Restoration_2026-09-14.md'
          handoff.write_text(f'''# Perlin + Living Studio restoration — 2026-09-14\n\nAuthor: GPT-5.6 Sol. Zach explicitly requested restoration after reporting that the Perlin SDF hills had disappeared and that Living Studio controls still depressed visually while sound and corresponding resonator growth no longer occurred.\n\n## Restored\n\n- `NoiseFloorWorld`: restored only `perlin-ground-plane.field` and `fieldExtent` from the intact authored `saves/worlds/noise_floor.json`; all later Zone/Object state is retained.\n- `SynthesisStudio.LivingInstrument`: migrated {len(law_ids)} authored Laws from the legacy world bundle into stable `saves/laws/<id>/law.json` roots and added the same stable ids to `lawRefs`.\n- Model-author closure: migrated {', '.join(migrated_authors) if migrated_authors else 'no additional referents'} from the old categories-bag compatibility side channel into nonvisual Zone-owned Object referent(s), preserving identifier/authorship instead of forging a Person.\n- `ZoneManager::switchTo`: shared Law authors resolve as `Singular`, matching `Law::addAuthor(Singular&)`; Person authors still resolve to the actual Person when that is their being.\n\n## Preservation\n\nExact pre-restoration Zone bytes are retained under `saves/backups/perlin-living-restoration-2026-09-14/`. Perlin recovery is field-scoped. Living Studio existing Objects are not regenerated or replaced; the only added Object is a previously external model-author referent needed to make the Zone's authored Law closure independently resolvable.\n\n## Verification still required\n\nAutomated live-path tests must enter Living Studio with `ZoneManager::switchTo()` and no legacy world load, then prove note audio and resonator growth. A Person desktop witness should confirm the Perlin hills, audible notes, and corresponding sphere growth after a fresh restart.\n''')

          print('Perlin restored; Living law roots:', len(law_ids), 'migrated authors:', migrated_authors)
          PY

      - name: Validate restoration shape
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('.')
          perlin=json.loads((p/'saves/zones/NoiseFloorWorld/zone.json').read_text())
          field=next(o for o in perlin['world']['objects'] if o['objectID']=='perlin-ground-plane')
          assert 'field' in field and field['fieldExtent']==[1000.0,30.0,1000.0]
          living=json.loads((p/'saves/zones/SynthesisStudio.LivingInstrument/zone.json').read_text())
          refs=living['lawRefs']
          assert len(refs)>=60 and len(refs)==len(set(refs))
          ids={o.get('objectID') for o in living['world']['objects']}
          assert 'author.gemini-spark' in ids and 'studio.author.astra' in ids
          for ref in refs:
              r=json.loads((p/'saves/laws'/ref/'law.json').read_text())
              assert r['identifier']==ref==r['law']['id']
          print('validated',len(refs),'Living Studio shared Laws')
          PY

      - name: Commit preservation restoration
        run: |
          git config user.name "GPT-5.6 Sol restoration"
          git config user.email "actions@users.noreply.github.com"
          git add saves/zones/NoiseFloorWorld/zone.json \
                  saves/zones/SynthesisStudio.LivingInstrument/zone.json \
                  saves/laws \
                  saves/backups/perlin-living-restoration-2026-09-14 \
                  src/ZonesOfEarth/ZoneManager.cpp \
                  "agent intercom/communication-threads/Perlin_Living_Studio_Restoration_2026-09-14.md"
          git commit -m "Restore Perlin SDF and Living Studio Law closure"
          git push origin HEAD:sol-restore-perlin-living-studio-2026-09-14
