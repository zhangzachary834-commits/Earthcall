name: PropertyPath dynamic-key witness

# Independent targeted witness: the broad focused workflow's shared
# cancel-in-progress group can cancel a rerun before any test executes.
# Keep this job read-only and scoped to PropertyPath changes.
on:
  pull_request:
    paths:
      - 'src/ConstructedBeing/Singular/Property/PropertyPath.cpp'
      - 'src/ConstructedBeing/Singular/Property/PropertyPath.hpp'
      - 'tests/singularity/property_path_precalc_test.cpp'
      - '.github/workflows/property-path-witness.yml'

permissions:
  contents: read

jobs:
  property-path-witness:
    name: PropertyPath regression witness (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Earthcall
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.22" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.22/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.22/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.22/libssl.a"

      - name: Build PropertyPath regression witness
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 4 --target property_path_precalc_test

      - name: Execute PropertyPath regression witness
        shell: bash
        run: |
          set -euxo pipefail
          ctest --test-dir build --output-on-failure --no-tests=error -R '^property_path_precalc_test$'
