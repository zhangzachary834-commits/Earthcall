name: Living Studio application-log window probe

on:
  push:
    branches:
      - sol/event-interest-fastpath-latest-20260914
    paths:
      - .github/workflows/living-studio-application-log-window-probe.yml
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure baseline
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target frame_lag_test -j3

      - name: A - vector sliding window
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee app-log-A-vector.txt
          exit 0

      - name: Replace application history backing store with deque
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/ZonesOfEarth/AuthorsOfLaw/Law.hpp')
          s = p.read_text()

          old = '#include <ctime>\n'
          if s.count(old) != 1:
              raise SystemExit('expected one <ctime> include')
          s = s.replace(old, '#include <ctime>\n#include <deque>\n', 1)

          old = '    const std::vector<ApplicationRecord>& applicationLog() const { return _applicationLog; }'
          if s.count(old) != 1:
              raise SystemExit('applicationLog accessor shape changed')
          s = s.replace(old, '    const std::deque<ApplicationRecord>& applicationLog() const { return _applicationLog; }', 1)

          old = '    std::vector<ApplicationRecord> _applicationLog;'
          if s.count(old) != 1:
              raise SystemExit('applicationLog member shape changed')
          s = s.replace(old, '    std::deque<ApplicationRecord> _applicationLog;', 1)
          p.write_text(s)
          PY

      - name: Rebuild deque variant and semantic witnesses
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target frame_lag_test law_persistence_test law_audit_test -j3

      - name: History semantics witness
        run: |
          ./build/law_persistence_test 2>&1 | tee app-log-persistence-witness.txt
          ./build/law_audit_test 2>&1 | tee app-log-audit-witness.txt

      - name: B - deque sliding window
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee app-log-B-deque.txt
          exit 0

      - name: Print A/B headline
        run: |
          echo '=== A vector ==='
          grep -E 'Tick [0-9]+:|LAG +median simulation frame|of that, LawManager::tick|95th-percentile frame|LawManager::tick grows|machine steadiness' app-log-A-vector.txt || true
          echo '=== B deque ==='
          grep -E 'Tick [0-9]+:|LAG +median simulation frame|of that, LawManager::tick|95th-percentile frame|LawManager::tick grows|machine steadiness' app-log-B-deque.txt || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: living-application-log-window-${{ github.run_id }}
          path: |
            app-log-A-vector.txt
            app-log-B-deque.txt
            app-log-persistence-witness.txt
            app-log-audit-witness.txt
