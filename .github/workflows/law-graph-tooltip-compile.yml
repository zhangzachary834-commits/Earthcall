name: Law Graph tooltip UI compile witness

on:
  push:
    branches:
      - law-graph-tooltips-6704501558942576734
  pull_request:
    paths:
      - src/Singularity/Screen/LawGraphWindow.cpp
      - .github/workflows/law-graph-tooltip-compile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-law-graph-ui:
    name: Compile actual Law Graph UI target (macOS 15)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Earthcall
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.22" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.22/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.22/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.22/libssl.a"
      - name: Compile lived WebGPU application containing LawGraphWindow.cpp
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 4 --target earthcall_webgpu
