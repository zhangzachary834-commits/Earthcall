name: Post-Formation Rete dirty-path profile

on:
  push:
    branches:
      - sol/post-formation-rete-living-profile-20260915
    paths:
      - .github/workflows/post-formation-living-profile.yml
  workflow_dispatch:

jobs:
  profile:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Instrument dirty Rete internals
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.hpp',
               '''    bool markFactDirty(const std::string& subjectId, const std::string& attribute);\n    void evaluateDirty();\n    bool hasDirtyFacts() const { return !_dirtyFacts.empty(); }''',
               '''    bool markFactDirty(const std::string& subjectId, const std::string& attribute);\n    struct DirtyTiming {\n        double readCompareMs = 0.0;\n        double retractMs = 0.0;\n        double assertMs = 0.0;\n        std::size_t dequeued = 0;\n        std::size_t changed = 0;\n        std::size_t unchanged = 0;\n        std::size_t missing = 0;\n    };\n    void evaluateDirty();\n    void resetDirtyTiming() { _dirtyTiming = {}; }\n    const DirtyTiming& lastDirtyTiming() const { return _dirtyTiming; }\n    bool hasDirtyFacts() const { return !_dirtyFacts.empty(); }''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.hpp',
               '''    std::vector<FactPtr> _dirtyFacts;\n    std::vector<AlphaNode> _alphaNodes;''',
               '''    std::vector<FactPtr> _dirtyFacts;\n    DirtyTiming _dirtyTiming{};\n    std::vector<AlphaNode> _alphaNodes;''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''void ReteNetwork::evaluateDirty() {\n    std::vector<FactPtr> dirty = std::move(_dirtyFacts);\n    _dirtyFacts.clear();\n    \n    for (auto& fact : dirty) {\n        if (!fact->dirty) continue;\n        fact->dirty = false;\n        \n        if (!fact->subject) continue;\n        \n        auto* prop = fact->subject->findProperty(fact->attribute);\n        if (prop) {\n            nlohmann::json newValue = propertyValueToJson(prop->value());\n            if (fact->value == newValue) continue; // no change\n            \n            // Retract the old fact\n            retractFact(fact->id);\n            \n            // Update value and re-assert\n            fact->value = newValue;\n            assertFact(fact);\n        }\n    }\n}''',
               '''void ReteNetwork::evaluateDirty() {\n    std::vector<FactPtr> dirty = std::move(_dirtyFacts);\n    _dirtyFacts.clear();\n    _dirtyTiming.dequeued = dirty.size();\n\n    for (auto& fact : dirty) {\n        if (!fact->dirty) continue;\n        fact->dirty = false;\n\n        const double read0 = glfwGetTime();\n        if (!fact->subject) {\n            _dirtyTiming.readCompareMs += (glfwGetTime() - read0) * 1000.0;\n            ++_dirtyTiming.missing;\n            continue;\n        }\n\n        auto* prop = fact->subject->findProperty(fact->attribute);\n        if (!prop) {\n            _dirtyTiming.readCompareMs += (glfwGetTime() - read0) * 1000.0;\n            ++_dirtyTiming.missing;\n            continue;\n        }\n        nlohmann::json newValue = propertyValueToJson(prop->value());\n        const bool same = fact->value == newValue;\n        _dirtyTiming.readCompareMs += (glfwGetTime() - read0) * 1000.0;\n        if (same) {\n            ++_dirtyTiming.unchanged;\n            continue;\n        }\n        ++_dirtyTiming.changed;\n\n        const double retract0 = glfwGetTime();\n        retractFact(fact->id);\n        _dirtyTiming.retractMs += (glfwGetTime() - retract0) * 1000.0;\n\n        fact->value = newValue;\n        const double assert0 = glfwGetTime();\n        assertFact(fact);\n        _dirtyTiming.assertMs += (glfwGetTime() - assert0) * 1000.0;\n    }\n}''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''    if (_rete.hasDirtyFacts()) {\n        _rete.evaluateDirty();\n        _dirty = true;\n    }''',
               '''    _rete.resetDirtyTiming();\n    if (_rete.hasDirtyFacts()) {\n        _rete.evaluateDirty();\n        _dirty = true;\n    }''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    double physicsMs = 0.0;\n};''',
               '''    double physicsMs = 0.0;\n    double dirtyReadMs = 0.0;\n    double dirtyRetractMs = 0.0;\n    double dirtyAssertMs = 0.0;\n    double dirtyDequeued = 0.0;\n    double dirtyChanged = 0.0;\n    double dirtyUnchanged = 0.0;\n    double dirtyMissing = 0.0;\n};''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    r.firings = lawManager.tick().size();\n    const auto t3 = Clock::now();''',
               '''    r.firings = lawManager.tick().size();\n    const auto dirty = lawManager.rete().lastDirtyTiming();\n    const auto t3 = Clock::now();''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    r.physicsMs    = zoneTiming.physicsMs;\n    \n    r.relationsMs = std::chrono::duration<double, std::milli>(t2 - t1).count();''',
               '''    r.physicsMs    = zoneTiming.physicsMs;\n    r.dirtyReadMs = dirty.readCompareMs;\n    r.dirtyRetractMs = dirty.retractMs;\n    r.dirtyAssertMs = dirty.assertMs;\n    r.dirtyDequeued = static_cast<double>(dirty.dequeued);\n    r.dirtyChanged = static_cast<double>(dirty.changed);\n    r.dirtyUnchanged = static_cast<double>(dirty.unchanged);\n    r.dirtyMissing = static_cast<double>(dirty.missing);\n    \n    r.relationsMs = std::chrono::duration<double, std::milli>(t2 - t1).count();''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    std::printf("  %-28s zone %8.3f ms   relations %7.3f ms   law %8.3f ms  (medians)\\n",\n                "by phase", samples.medianOf(&FrameResult::zoneMs),\n                samples.medianOf(&FrameResult::relationsMs),\n                samples.medianOf(&FrameResult::lawMs));''',
               '''    std::printf("  %-28s zone %8.3f ms   relations %7.3f ms   law %8.3f ms  (medians)\\n",\n                "by phase", samples.medianOf(&FrameResult::zoneMs),\n                samples.medianOf(&FrameResult::relationsMs),\n                samples.medianOf(&FrameResult::lawMs));\n    std::printf("  DIRTY-INTERNAL medians: queued %.0f | changed %.0f | unchanged %.0f | missing %.0f | read+compare %.3f ms | retract %.3f ms | assert %.3f ms\\n",\n                samples.medianOf(&FrameResult::dirtyDequeued),\n                samples.medianOf(&FrameResult::dirtyChanged),\n                samples.medianOf(&FrameResult::dirtyUnchanged),\n                samples.medianOf(&FrameResult::dirtyMissing),\n                samples.medianOf(&FrameResult::dirtyReadMs),\n                samples.medianOf(&FrameResult::dirtyRetractMs),\n                samples.medianOf(&FrameResult::dirtyAssertMs));''')
          PY

      - name: Configure and build diagnostic benchmark
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target frame_lag_test -j3

      - name: Profile Living Instrument dirty path
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee dirty-internal-profile.txt
          exit 0

      - name: Print diagnostic headline
        run: |
          grep -E 'Tick [0-9]+:|median simulation frame|of that, LawManager::tick|DIRTY-INTERNAL|machine steadiness' dirty-internal-profile.txt || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: post-formation-dirty-internal-${{ github.run_id }}
          path: dirty-internal-profile.txt
