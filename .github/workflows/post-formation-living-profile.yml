name: Post-Formation Rete Living Instrument profile

on:
  push:
    branches:
      - sol/post-formation-rete-living-profile-20260915
    paths:
      - .github/workflows/post-formation-living-profile.yml
  workflow_dispatch:

jobs:
  profile:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Instrument dirty, agenda, and continuous/reactive subphases
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.hpp',
               '''        float evalMs    = 0.0f;   // Rete evaluation + agenda drain + continuous sweep\n        float driveMs   = 0.0f;   // runDriveSessions''',
               '''        float evalMs    = 0.0f;   // Rete evaluation + agenda drain + continuous sweep\n        float dirtyMs   = 0.0f;   // dirty Rete evaluation\n        float agendaMs  = 0.0f;   // activation agenda / OnEvent execution\n        float sweepMs   = 0.0f;   // continuous/reactive law evaluation + application\n        float driveMs   = 0.0f;   // runDriveSessions''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''    if (_rete.hasDirtyFacts()) {\n        _rete.evaluateDirty();\n        _dirty = true;\n    }\n\n    std::vector<Law::ApplicationRecord> records;''',
               '''    if (_rete.hasDirtyFacts()) {\n        _rete.evaluateDirty();\n        _dirty = true;\n    }\n    auto T2Dirty = glfwGetTime();\n\n    std::vector<Law::ApplicationRecord> records;''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''    const std::vector<std::shared_ptr<Law>> continuousLaws = _laws;''',
               '''    auto T2Agenda = glfwGetTime();\n    const std::vector<std::shared_ptr<Law>> continuousLaws = _laws;''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''    _tickTiming.evalMs  = static_cast<float>((T3 - T2) * 1000.0);\n    _tickTiming.driveMs = static_cast<float>((T4 - T3) * 1000.0);''',
               '''    _tickTiming.evalMs   = static_cast<float>((T3 - T2) * 1000.0);\n    _tickTiming.dirtyMs  = static_cast<float>((T2Dirty - T2) * 1000.0);\n    _tickTiming.agendaMs = static_cast<float>((T2Agenda - T2Dirty) * 1000.0);\n    _tickTiming.sweepMs  = static_cast<float>((T3 - T2Agenda) * 1000.0);\n    _tickTiming.driveMs  = static_cast<float>((T4 - T3) * 1000.0);''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    double physicsMs = 0.0;\n};''',
               '''    double physicsMs = 0.0;\n\n    double lawDirtyMs  = 0.0;\n    double lawAgendaMs = 0.0;\n    double lawSweepMs  = 0.0;\n};''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    r.firings = lawManager.tick().size();\n    const auto t3 = Clock::now();''',
               '''    r.firings = lawManager.tick().size();\n    const auto tickTiming = lawManager.lastTickTiming();\n    const auto t3 = Clock::now();''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    r.physicsMs    = zoneTiming.physicsMs;\n    \n    r.relationsMs = std::chrono::duration<double, std::milli>(t2 - t1).count();''',
               '''    r.physicsMs    = zoneTiming.physicsMs;\n    r.lawDirtyMs  = tickTiming.dirtyMs;\n    r.lawAgendaMs = tickTiming.agendaMs;\n    r.lawSweepMs  = tickTiming.sweepMs;\n    \n    r.relationsMs = std::chrono::duration<double, std::milli>(t2 - t1).count();''')

          once('tests/singularity/frame_lag_test.cpp',
               '''    std::printf("  %-28s zone %8.3f ms   relations %7.3f ms   law %8.3f ms  (medians)\\n",\n                "by phase", samples.medianOf(&FrameResult::zoneMs),\n                samples.medianOf(&FrameResult::relationsMs),\n                samples.medianOf(&FrameResult::lawMs));''',
               '''    std::printf("  %-28s zone %8.3f ms   relations %7.3f ms   law %8.3f ms  (medians)\\n",\n                "by phase", samples.medianOf(&FrameResult::zoneMs),\n                samples.medianOf(&FrameResult::relationsMs),\n                samples.medianOf(&FrameResult::lawMs));\n    std::printf("  POST-FORMATION EVAL-BREAKDOWN medians: dirty %.3f ms | agenda %.3f ms | continuous/reactive %.3f ms\\n",\n                samples.medianOf(&FrameResult::lawDirtyMs),\n                samples.medianOf(&FrameResult::lawAgendaMs),\n                samples.medianOf(&FrameResult::lawSweepMs));''')
          PY

      - name: Configure and build diagnostic benchmark
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target frame_lag_test -j3

      - name: Profile Living Instrument
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee post-formation-profile.txt
          exit 0

      - name: Print diagnostic headline
        run: |
          grep -E 'Tick [0-9]+:|median simulation frame|of that, LawManager::tick|POST-FORMATION EVAL-BREAKDOWN|machine steadiness' post-formation-profile.txt || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: post-formation-living-profile-${{ github.run_id }}
          path: post-formation-profile.txt
