name: Dirty state refresh A/B

on:
  push:
    branches:
      - sol/post-formation-rete-living-profile-20260915
    paths:
      - .github/workflows/post-formation-living-profile.yml
  workflow_dispatch:

jobs:
  profile:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure baseline
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target frame_lag_test -j3

      - name: Baseline Living Instrument
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee baseline.txt
          exit 0

      - name: Patch dirty state refresh to keep fact storage resident
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.hpp',
               '''    std::string assertFact(FactPtr fact);\n    bool retractFact(const std::string& factId);''',
               '''    std::string assertFact(FactPtr fact, bool alreadyStored = false);\n    bool retractFact(const std::string& factId, bool keepStored = false);''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''std::string ReteNetwork::assertFact(FactPtr fact) {''',
               '''std::string ReteNetwork::assertFact(FactPtr fact, bool alreadyStored) {''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''    // Both participants, because retractFactsAbout matches on either.\n    if (fact->subject) _factParticipants.insert(fact->subject);\n    if (fact->object)  _factParticipants.insert(fact->object);\n    if (fact->subject && fact->isState && fact->type == "relation-state") {\n        _relationStateIndex[fact->subject].insert(fact->attribute);\n    }\n    _facts.push_back(fact);\n    const FactPtr& f = fact;\n    _factById[f->id] = f;\n    if (f->isState) {\n        _stateFactsBySubjectAttr[f->subjectId + ":" + f->attribute].push_back(f);\n    }''',
               '''    const FactPtr& f = fact;\n    // A dirty persistent state fact already exists in the fact store and its\n    // identity indices. Refreshing its Rete consequences must not physically\n    // remove and append it: that turns every value change into an O(facts)\n    // vector erase even though the fact itself never ceased to exist.\n    if (!alreadyStored) {\n        // Both participants, because retractFactsAbout matches on either.\n        if (fact->subject) _factParticipants.insert(fact->subject);\n        if (fact->object)  _factParticipants.insert(fact->object);\n        if (fact->subject && fact->isState && fact->type == "relation-state") {\n            _relationStateIndex[fact->subject].insert(fact->attribute);\n        }\n        _facts.push_back(fact);\n        _factById[f->id] = f;\n        if (f->isState) {\n            _stateFactsBySubjectAttr[f->subjectId + ":" + f->attribute].push_back(f);\n        }\n    }''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''bool ReteNetwork::retractFact(const std::string& factId) {\n    auto factIt = _factById.find(factId);\n    if (factIt == _factById.end()) return false;\n    FactPtr fact = factIt->second;\n    _factById.erase(factIt);\n\n    if (fact->isState) {\n        auto sIt = _stateFactsBySubjectAttr.find(fact->subjectId + ":" + fact->attribute);\n        if (sIt != _stateFactsBySubjectAttr.end()) {\n            auto& vec = sIt->second;\n            vec.erase(std::remove_if(vec.begin(), vec.end(), [&](const FactPtr& f) { return f->id == factId; }), vec.end());\n            if (vec.empty()) _stateFactsBySubjectAttr.erase(sIt);\n        }\n        if (fact->type == "relation-state" && fact->subject) {\n            auto rIt = _relationStateIndex.find(fact->subject);\n            if (rIt != _relationStateIndex.end()) {\n                rIt->second.erase(fact->attribute);\n                if (rIt->second.empty()) _relationStateIndex.erase(rIt);\n            }\n        }\n    }\n\n    auto it = std::find_if(_facts.begin(), _facts.end(), [&](const FactPtr& f) { return f->id == factId; });\n    if (it != _facts.end()) _facts.erase(it);''',
               '''bool ReteNetwork::retractFact(const std::string& factId, bool keepStored) {\n    auto factIt = _factById.find(factId);\n    if (factIt == _factById.end()) return false;\n    FactPtr fact = factIt->second;\n\n    // Ordinary retraction means the fact ceased to exist. Dirty-state refresh\n    // is different: the persistent fact remains true as an identity, only its\n    // value changed. In that case retain the fact store and identity indices\n    // while still retracting every old alpha/beta/agenda consequence below.\n    if (!keepStored) {\n        _factById.erase(factIt);\n\n        if (fact->isState) {\n            auto sIt = _stateFactsBySubjectAttr.find(fact->subjectId + ":" + fact->attribute);\n            if (sIt != _stateFactsBySubjectAttr.end()) {\n                auto& vec = sIt->second;\n                vec.erase(std::remove_if(vec.begin(), vec.end(), [&](const FactPtr& f) { return f->id == factId; }), vec.end());\n                if (vec.empty()) _stateFactsBySubjectAttr.erase(sIt);\n            }\n            if (fact->type == "relation-state" && fact->subject) {\n                auto rIt = _relationStateIndex.find(fact->subject);\n                if (rIt != _relationStateIndex.end()) {\n                    rIt->second.erase(fact->attribute);\n                    if (rIt->second.empty()) _relationStateIndex.erase(rIt);\n                }\n            }\n        }\n\n        auto it = std::find_if(_facts.begin(), _facts.end(), [&](const FactPtr& f) { return f->id == factId; });\n        if (it != _facts.end()) _facts.erase(it);\n    }''')

          once('src/ZonesOfEarth/AuthorsOfLaw/Law.cpp',
               '''            // Retract the old fact\n            retractFact(fact->id);\n            \n            // Update value and re-assert\n            fact->value = newValue;\n            assertFact(fact);''',
               '''            // Retract only the old discrimination consequences. The\n            // persistent state fact itself remains resident and keeps its order.\n            retractFact(fact->id, true);\n\n            // Update value and re-propagate without duplicating fact storage.\n            fact->value = newValue;\n            assertFact(fact, true);''')
          PY

      - name: Rebuild candidate and semantic witnesses
        run: |
          cmake --build build --target \
            frame_lag_test \
            prophetic_rete_test \
            event_interest_filter_test \
            rete_compile_test \
            rete_relation_state_test \
            edge_reactive_path_test \
            reactive_departure_test \
            vocabulary_index_test \
            -j3

      - name: Run semantic witnesses
        run: |
          set -e
          ./build/prophetic_rete_test
          ./build/event_interest_filter_test
          ./build/rete_compile_test
          ./build/rete_relation_state_test
          ./build/edge_reactive_path_test
          ./build/reactive_departure_test
          ./build/vocabulary_index_test

      - name: Candidate Living Instrument
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee candidate.txt
          exit 0

      - name: Print A/B headlines
        run: |
          echo '=== BASELINE ==='
          grep -E 'Tick [0-9]+:|simulation frame|by phase|of that, LawManager::tick|machine calibration|machine steadiness' baseline.txt || true
          echo '=== CANDIDATE ==='
          grep -E 'Tick [0-9]+:|simulation frame|by phase|of that, LawManager::tick|machine calibration|machine steadiness' candidate.txt || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dirty-state-resident-ab-${{ github.run_id }}
          path: |
            baseline.txt
            candidate.txt
