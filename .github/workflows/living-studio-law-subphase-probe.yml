name: Living Studio LawManager subphase probe

on:
  push:
    branches:
      - sol/event-interest-fastpath-latest-20260914
    paths:
      - .github/workflows/living-studio-law-subphase-probe.yml
  workflow_dispatch:

jobs:
  profile:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Instrument frame_lag_test with existing TickTiming fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/singularity/frame_lag_test.cpp')
          s = p.read_text()

          old = '''    double physicsMs = 0.0;\n};'''
          new = '''    double physicsMs = 0.0;\n\n    double lawSyncMs  = 0.0;\n    double lawSeedMs  = 0.0;\n    double lawEvalMs  = 0.0;\n    double lawDriveMs = 0.0;\n    double lawReapMs  = 0.0;\n};'''
          if s.count(old) != 1:
              raise SystemExit('FrameResult insertion point changed')
          s = s.replace(old, new, 1)

          old = '''    r.firings = lawManager.tick().size();\n    const auto t3 = Clock::now();'''
          new = '''    r.firings = lawManager.tick().size();\n    const auto tickTiming = lawManager.lastTickTiming();\n    const auto t3 = Clock::now();'''
          if s.count(old) != 1:
              raise SystemExit('stepFrame tick insertion point changed')
          s = s.replace(old, new, 1)

          old = '''    r.physicsMs    = zoneTiming.physicsMs;\n    \n    r.relationsMs = std::chrono::duration<double, std::milli>(t2 - t1).count();'''
          new = '''    r.physicsMs    = zoneTiming.physicsMs;\n\n    r.lawSyncMs   = tickTiming.syncMs;\n    r.lawSeedMs   = tickTiming.seedMs;\n    r.lawEvalMs   = tickTiming.evalMs;\n    r.lawDriveMs  = tickTiming.driveMs;\n    r.lawReapMs   = tickTiming.reapMs;\n    \n    r.relationsMs = std::chrono::duration<double, std::milli>(t2 - t1).count();'''
          if s.count(old) != 1:
              raise SystemExit('stepFrame timing assignment point changed')
          s = s.replace(old, new, 1)

          old = '''    std::printf("  %-28s zone %8.3f ms   relations %7.3f ms   law %8.3f ms  (medians)\\n",\n                "by phase", samples.medianOf(&FrameResult::zoneMs),\n                samples.medianOf(&FrameResult::relationsMs),\n                samples.medianOf(&FrameResult::lawMs));'''
          new = '''    std::printf("  %-28s zone %8.3f ms   relations %7.3f ms   law %8.3f ms  (medians)\\n",\n                "by phase", samples.medianOf(&FrameResult::zoneMs),\n                samples.medianOf(&FrameResult::relationsMs),\n                samples.medianOf(&FrameResult::lawMs));\n    std::printf("  LAW-SUBPHASE medians: sync %.3f ms | seed %.3f ms | eval+sweep %.3f ms | drive %.3f ms | reap %.3f ms\\n",\n                samples.medianOf(&FrameResult::lawSyncMs),\n                samples.medianOf(&FrameResult::lawSeedMs),\n                samples.medianOf(&FrameResult::lawEvalMs),\n                samples.medianOf(&FrameResult::lawDriveMs),\n                samples.medianOf(&FrameResult::lawReapMs));'''
          if s.count(old) != 1:
              raise SystemExit('steady report insertion point changed')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Configure and build diagnostic benchmark
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DOPENSSL_ROOT_DIR="$PWD/local_deps/openssl-3.0.13" \
            -DOPENSSL_INCLUDE_DIR="$PWD/local_deps/openssl-3.0.13/include" \
            -DOPENSSL_CRYPTO_LIBRARY="$PWD/local_deps/openssl-3.0.13/libcrypto.a" \
            -DOPENSSL_SSL_LIBRARY="$PWD/local_deps/openssl-3.0.13/libssl.a"
          cmake --build build --target frame_lag_test -j3

      - name: Profile Living Instrument
        run: |
          set +e
          ./build/frame_lag_test saves/worlds/synthesis_studio_living.json 2>&1 | tee law-subphase.txt
          exit 0

      - name: Print diagnostic headline
        run: |
          grep -E 'Tick [0-9]+:|median simulation frame|of that, LawManager::tick|LAW-SUBPHASE|machine steadiness' law-subphase.txt || true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: living-law-subphase-${{ github.run_id }}
          path: law-subphase.txt
