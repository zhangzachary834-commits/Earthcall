<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthcall (Wasm)</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" type="text/css">
    <!-- Load Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
        /* The canvas must be full screen for WebGPU */
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to ImGui/Canvas by default */
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='ui/app.css') }}" type="text/css">
    <div id="ui-layer">
        <!-- Modern HTML UI will be injected here by app.js -->
    </div>
    <script src="{{ url_for('static', filename='ui/app.js') }}"></script>

    <!-- Emscripten Module Config -->
    <script>
        var Module = {
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                console.log("Earthcall Wasm Engine Initialized!");
                // Connect SocketIO once Wasm is ready
                window.initSocketIO();
            }
        };
    </script>
    
    <!-- Client Bridge -->
    <script src="{{ url_for('static', filename='earthcall_client.js') }}"></script>
    <!-- The compiled C++ engine (to be built into static/) -->
    <script src="{{ url_for('static', filename='earthcall.js') }}"></script>
</body>
</html>
