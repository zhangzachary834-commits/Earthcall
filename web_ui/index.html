<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthcall - Logos Interface</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #viewport-container {
            flex-grow: 1;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        /* Earthcall canvas for WebGPU / WASM */
        #earthcall-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #logos-interface {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #utterance-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.1em;
            padding: 10px;
            outline: none;
        }

        #utterance-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        #emit-btn {
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #emit-btn:hover {
            background: #357abd;
        }

        #connection-status {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f5a623; /* Connecting */
        }

        .connected .status-dot {
            background: #7ed321;
        }
    </style>
</head>
<body>

    <div id="viewport-container">
        <!-- The canvas is used if running in Emscripten WASM mode -->
        <canvas id="earthcall-canvas" oncontextmenu="event.preventDefault()"></canvas>
        
        <div id="connection-status">
            <div class="status-dot" id="status-indicator"></div>
            <span id="status-text">Initializing...</span>
        </div>

        <div id="logos-interface">
            <input type="text" id="utterance-input" placeholder="Speak a word into the World... (e.g. 'Joy')" autocomplete="off">
            <button id="emit-btn">Emit</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
