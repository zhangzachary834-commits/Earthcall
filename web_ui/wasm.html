<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Earthcall Web</title>
    <!--
      The page that boots the wasm build. It lived in build-wasm/ — a build
      OUTPUT directory, now gitignored — so `rm -rf build-wasm`, a perfectly
      reasonable thing to do to a build directory, destroyed the only working
      entry point the project had. It is tracked here instead.

      #earthcall-canvas is not decorative: WebGpuContext_wasm.cpp hardcodes
      that selector. Renaming it breaks surface creation.

      Serve the repo root (not web_ui/) so the relative path below resolves:
        cmake -S . -B build-wasm ... && cmake --build build-wasm
        python3 -m http.server   # then open /web_ui/wasm.html
    -->
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="start-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); color: white; display: flex; align-items: center; justify-content: center; z-index: 100; cursor: pointer; font-family: sans-serif;">
        <h1>Click to Start Earthcall</h1>
    </div>
    <canvas id="earthcall-canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script type='text/javascript'>
      var Module = {
        print: (text) => console.log('WASM PRINT: ' + text),
        printErr: (text) => console.log('WASM ERR: ' + text),
        canvas: (function() {
          var canvas = document.getElementById('earthcall-canvas');
          return canvas;
        })()
      };

      document.getElementById('start-overlay').addEventListener('click', function() {
          this.style.display = 'none';
          // A user gesture has occurred.
          // Emscripten's WebAudio and pointer lock logic will now be permitted.
          // We can also explicitly request pointer lock on the canvas here if desired.
          document.getElementById('earthcall-canvas').requestPointerLock();
      });
    </script>
    <script async type="text/javascript" src="../build-wasm/earthcall.js"></script>
</body>
</html>
